name: Feature request
description: Suggest a focused improvement to MaskedBundle
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Please describe the problem or use case first, then the proposed
        solution. Do not include real secrets, credentials, personal data,
        production logs, or real payment-card information.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: I have not included real sensitive or production data.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative approaches or workarounds.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: |
        Mention any expected impact on public API, Symfony integration,
        Monolog integration, configuration, or existing behavior.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other non-sensitive information that may help.
